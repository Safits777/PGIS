<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      /* COLOR TOKENS: edit this block to reskin the dial. */
      --color-canvas: #f7f8f6;
      --color-surface: #ffffff;
      --color-surface-soft: #f0f2f0;
      --color-border: #d8ddd8;
      --color-border-strong: #b8c0ba;
      --color-text: #1f2328;
      --color-muted: #69737d;
      --color-accent: #0078d4;
      --color-accent-strong: #005a9e;
      --color-accent-soft: #dcebfa;
      --color-track: #e2e7e3;
      --color-highlight: rgba(255, 255, 255, 0.92);
      --color-shadow: rgba(31, 35, 40, 0.14);
      --color-shadow-soft: rgba(31, 35, 40, 0.08);

      /* SIZE TOKENS */
      --angle: 45deg;
      --dial-size: 104px;
      --frame-height: 110px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: var(--frame-height);
      display: grid;
      place-items: center;
      background: var(--color-canvas);
      color: var(--color-text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
      opacity: 1;
      filter: none;
    }

    .shell {
      width: min(var(--dial-size), calc(100vw - 8px));
      aspect-ratio: 1;
      position: relative;
      display: grid;
      place-items: center;
      user-select: none;
      touch-action: none;
      opacity: 1;
      filter: none;
    }

    .dial {
      position: absolute;
      inset: 8px;
      border-radius: 50%;
      border: 1px solid var(--color-border);
      background:
        radial-gradient(circle at center, var(--color-surface) 0 39%, transparent 40%),
        conic-gradient(from 0deg, var(--color-accent) 0 var(--angle), var(--color-track) var(--angle) 360deg),
        var(--color-surface-soft);
      box-shadow:
        0 10px 24px var(--color-shadow),
        0 2px 6px var(--color-shadow-soft),
        inset 0 0 0 1px var(--color-highlight);
      cursor: pointer;
    }

    .shell:active .dial {
      opacity: 1;
      filter: none;
      box-shadow:
        0 7px 18px var(--color-shadow),
        inset 0 0 0 1px var(--color-highlight);
    }

    .dial::before,
    .dial::after {
      content: "";
      position: absolute;
      inset: 11px;
      border-radius: 50%;
      border: 1px solid var(--color-border);
      pointer-events: none;
    }

    .dial::after {
      inset: 27px;
      border-color: var(--color-accent-soft);
    }

    .needle {
      position: absolute;
      width: 2px;
      height: calc(50% - 15px);
      left: calc(50% - 1px);
      bottom: 50%;
      transform-origin: 50% 100%;
      transform: rotate(var(--angle));
      background: linear-gradient(180deg, var(--color-accent), var(--color-accent-strong));
      box-shadow: 0 0 12px var(--color-accent-soft);
      pointer-events: none;
    }

    .knob {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      transform:
        rotate(var(--angle))
        translateY(calc(-1 * (min(var(--dial-size), calc(100vw - 8px)) / 2 - 16px)))
        rotate(calc(-1 * var(--angle)))
        translate(-50%, -50%);
      border: 1px solid var(--color-accent-strong);
      background: var(--color-surface);
      box-shadow: 0 2px 8px var(--color-shadow), 0 0 0 3px var(--color-accent-soft);
      pointer-events: none;
    }

    .center {
      width: 48px;
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      align-content: center;
      gap: 2px;
      border-radius: 50%;
      border: 1px solid var(--color-border-strong);
      background:
        linear-gradient(135deg, var(--color-highlight), transparent 58%, var(--color-accent-soft)),
        var(--color-surface);
      box-shadow:
        0 2px 8px var(--color-shadow-soft),
        inset 0 0 0 1px var(--color-highlight);
      pointer-events: none;
      z-index: 2;
    }

    .value {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 14px;
      line-height: 1;
      font-weight: 900;
      color: var(--color-text);
    }

    .compass {
      font-size: 8px;
      font-weight: 900;
      color: var(--color-accent);
    }

    .cardinal {
      position: absolute;
      color: var(--color-muted);
      font-size: 8px;
      font-weight: 900;
      pointer-events: none;
    }

    .n { top: 0; left: 50%; transform: translateX(-50%); }
    .e { right: 0; top: 50%; transform: translateY(-50%); }
    .s { bottom: 0; left: 50%; transform: translateX(-50%); }
    .w { left: 0; top: 50%; transform: translateY(-50%); }
  </style>
</head>
<body>
  <div class="shell" id="shell">
    <div class="cardinal n">N</div>
    <div class="cardinal e">E</div>
    <div class="cardinal s">S</div>
    <div class="cardinal w">W</div>
    <div class="dial" id="dial"></div>
    <div class="needle"></div>
    <div class="knob"></div>
    <div class="center">
      <div class="value" id="value">045</div>
      <div class="compass" id="compass">NE</div>
    </div>
  </div>
  <script>
    const root = document.documentElement;
    const shell = document.getElementById("shell");
    const valueEl = document.getElementById("value");
    const compassEl = document.getElementById("compass");
    let value = 45;
    let dragging = false;

    function post(type, data) {
      window.parent.postMessage(Object.assign({
        isStreamlitMessage: true,
        type: type
      }, data || {}), "*");
    }

    function componentReady() {
      post("streamlit:componentReady", { apiVersion: 1 });
      setFrameHeight();
    }

    function setFrameHeight() {
      post("streamlit:setFrameHeight", { height: document.body.scrollHeight || 110 });
    }

    function setComponentValue(nextValue) {
      post("streamlit:setComponentValue", {
        value: nextValue,
        dataType: "json"
      });
    }

    function broadcastDirectionPreview(nextValue) {
      const preview = {
        type: "pgis:directionPreview",
        value: normalize(nextValue)
      };
      window.parent.postMessage(preview, "*");
    }

    function normalize(degrees) {
      return ((Math.round(degrees) % 360) + 360) % 360;
    }

    function compassLabel(degrees) {
      const labels = ["N", "NE", "E", "SE", "S", "SW", "W", "NW"];
      return labels[Math.floor((normalize(degrees) + 22.5) / 45) % 8];
    }

    function angleFromPoint(clientX, clientY) {
      const rect = shell.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;
      const radians = Math.atan2(clientY - centerY, clientX - centerX);
      return normalize((radians * 180 / Math.PI) + 90);
    }

    function render(nextValue, emit, preview) {
      value = normalize(nextValue);
      root.style.setProperty("--angle", value + "deg");
      valueEl.textContent = String(value).padStart(3, "0");
      compassEl.textContent = compassLabel(value);
      if (preview) {
        broadcastDirectionPreview(value);
      }
      if (emit) {
        setComponentValue(value);
      }
    }

    shell.addEventListener("pointerdown", function(event) {
      event.preventDefault();
      dragging = true;
      shell.setPointerCapture(event.pointerId);
      render(angleFromPoint(event.clientX, event.clientY), false, true);
    });

    shell.addEventListener("pointermove", function(event) {
      if (!dragging) {
        return;
      }
      event.preventDefault();
      render(angleFromPoint(event.clientX, event.clientY), false, true);
    });

    shell.addEventListener("pointerup", function(event) {
      if (dragging) {
        render(angleFromPoint(event.clientX, event.clientY), false, true);
        setComponentValue(value);
      }
      dragging = false;
      if (shell.hasPointerCapture(event.pointerId)) {
        shell.releasePointerCapture(event.pointerId);
      }
    });

    shell.addEventListener("pointercancel", function(event) {
      dragging = false;
      if (shell.hasPointerCapture(event.pointerId)) {
        shell.releasePointerCapture(event.pointerId);
      }
    });

    shell.addEventListener("contextmenu", function(event) {
      event.preventDefault();
    });

    window.addEventListener("message", function(event) {
      if (!event.data || event.data.type !== "streamlit:render") {
        return;
      }
      const args = event.data.args || {};
      const incoming = Number(args.value);
      if (!Number.isNaN(incoming)) {
        render(incoming, false, false);
      }
      setFrameHeight();
    });

    render(value, false, false);
    componentReady();
    window.addEventListener("resize", setFrameHeight);
  </script>
</body>
</html>
